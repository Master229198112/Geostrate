name: Sync to Official Repository

on:
  push:
    branches:
      - master # Set to master as per your requirement

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Personal Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Official Repo
        env:
          # This matches the name 'OFFICIAL_GIT_TOKEN' seen in your screenshot
          OFFICIAL_TOKEN: ${{ secrets.OFFICIAL_GIT_TOKEN }}
        run: |
          # 1. Add the official project repo as a remote
          git remote add official_repo https://x-access-token:${OFFICIAL_TOKEN}@github.com/evidentia-project/Geostrate.git

          # 2. Force push the master branch to the official repo
          # Using --force ensures it stays perfectly in sync even if histories differ
          git push official_repo master --force
